<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ROVER.Web</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#F4F3EE;--sf:#FFFFFF;--ink:#1A2520;--mut:#66726C;--side:#10241D;--side-ink:#E9F1EC;
 --pri:#1F7A5C;--pri-ink:#FFFFFF;--sun:#F3B232;--sun-ink:#2A1E00;--acc:#C8402F;--ln:#E2E1D9;--ok:#1F7A5C;--soft:#FBF0D3;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 color-scheme:light
}
:root[data-theme="dark"]{
 --bg:#0C1612;--sf:#14231D;--ink:#E8F0EB;--mut:#8FA198;--side:#08120E;--side-ink:#E8F0EB;
 --pri:#3DBF94;--pri-ink:#04201A;--sun:#F3B232;--sun-ink:#2A1E00;--acc:#FF7A66;--ln:#243630;--ok:#4CD39B;--soft:#2B2A17;
 color-scheme:dark
}
:root[data-theme="eye"]{
 --bg:#EFE4C8;--sf:#F7EED7;--ink:#2D2419;--mut:#705F4A;--side:#292117;--side-ink:#F4E9CE;
 --pri:#2E7D5B;--pri-ink:#FFFDF7;--sun:#E09F24;--sun-ink:#261900;--acc:#B8432E;--ln:#DCCCA8;--ok:#2E7D5B;--soft:#F3DFB0;
 color-scheme:light
}
:root.tap-shift{
 --bg:color-mix(in srgb, var(--bg) 93%, var(--pri) 7%);
 --sf:color-mix(in srgb, var(--sf) 94%, var(--sun) 6%);
 --pri:color-mix(in srgb, var(--pri) 88%, var(--sun) 12%);
 --sun:color-mix(in srgb, var(--sun) 88%, var(--pri) 12%);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{
 margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.7 'Vazirmatn',Tahoma,sans-serif;
 transition:background-color .65s ease,color .65s ease
}
.card,.tw,input,select,textarea,button,.hero,.login .card,.home,.sbar,.tb,aside,.msg,.chip{
 transition:background-color .65s ease,color .65s ease,border-color .65s ease,box-shadow .65s ease,opacity .45s ease
}
button{font-family:inherit}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px}
.logo{width:36px;height:36px;border-radius:11px;background:var(--sun);color:var(--sun-ink);display:grid;place-items:center;font-weight:800}
aside{position:fixed;bottom:0;left:0;right:0;z-index:10;background:var(--side);color:var(--side-ink);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
aside .brand,aside .who,aside .tbar-wrap{display:none}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{flex:1 0 66px;display:flex;flex-direction:column;align-items:center;gap:0;background:none;border:0;color:inherit;opacity:.65;font-size:11px;padding:6px 4px;border-radius:10px;cursor:pointer}
nav button i{font-style:normal;font-size:20px;line-height:1.3}
nav button.on{opacity:1;background:var(--sun);color:var(--sun-ink);font-weight:600}
.tb{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;padding:12px 16px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
.tb-r{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ghost{background:none;border:1px solid var(--ln);color:var(--ink);border-radius:9px;padding:4px 12px;font-size:13px;cursor:pointer}
.tbar{display:inline-flex;gap:3px;background:rgba(128,128,128,.14);padding:3px;border-radius:10px;border:1px solid rgba(128,128,128,.2)}
.tbar button{border:0;background:none;color:inherit;border-radius:7px;padding:4px 9px;font:600 12px 'Vazirmatn',sans-serif;cursor:pointer;opacity:.75}
.tbar button.on{background:var(--sun);color:var(--sun-ink);opacity:1}
main{padding:4px 16px 100px;max-width:1000px}
h2{margin:6px 0 14px;font-size:26px;font-weight:800;letter-spacing:-.2px}
@media(min-width:800px){
 .app{display:grid;grid-template-columns:240px 1fr}
 aside{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px}
 aside .brand,aside .who,aside .tbar-wrap{display:flex}
 aside .tbar-wrap{margin-bottom:14px;padding:0 4px}
 aside .brand{margin-bottom:18px;padding:0 6px}
 nav{flex-direction:column;gap:4px;flex:1;overflow:auto}
 nav button{flex:none;flex-direction:row;gap:12px;font-size:15px;padding:10px 12px}
 nav button i{font-size:18px}
 .who{justify-content:space-between;align-items:center;border-top:1px solid rgba(255,255,255,.12);padding:14px 6px 0;font-size:14px}
 .who button{background:none;border:0;color:var(--sun);cursor:pointer;font-size:14px}
 .tb{display:none}
 main{padding:28px 32px 40px}
}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:16px}
.card small{color:var(--mut);display:block}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:12px}
.kpi b{font-size:24px;font-weight:800}
.neg b{color:var(--acc)}
.hero{background:var(--side);color:var(--side-ink);border-radius:18px;padding:20px}
.hero small{color:#9FB3A9}
.hero>b{display:block;font-size:38px;font-weight:800;color:var(--sun);line-height:1.3}
.bar{height:30px;border-radius:8px;margin:8px 0 0;padding:0 12px;font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:space-between;min-width:110px}
form.f{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-bottom:16px}
input{font:inherit;height:44px;padding:0 12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);min-width:0;width:100%}
input:focus{outline:0;border-color:var(--pri)}
button:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
.btn{background:var(--pri);color:var(--pri-ink);border:0;border-radius:10px;font:600 15px 'Vazirmatn',sans-serif;height:44px;padding:0 16px;cursor:pointer;width:100%}
.btn.pay{background:var(--sun);color:var(--sun-ink);height:50px;font-size:17px;font-weight:800}
.btn:disabled{opacity:.4;cursor:default}
.tw{overflow-x:auto;background:var(--sf);border:1px solid var(--ln);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:460px}
th,td{padding:12px 14px;text-align:right;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}
.del{background:var(--soft);border:0;color:var(--acc);border-radius:20px;padding:2px 12px;cursor:pointer;font-size:13px}
.empty{padding:28px;text-align:center;color:var(--mut)}
.foot{margin-top:12px;font-weight:800;font-size:17px}
.pos{display:grid;grid-template-columns:1fr;gap:14px;align-items:start}
@media(min-width:800px){.pos{grid-template-columns:1.6fr 1fr}.pos>.card{position:sticky;top:20px}}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:10px}
.pg button{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:12px 8px;color:var(--ink);font-size:14px;font-weight:600;cursor:pointer;text-align:center}
.pg button:active{border-color:var(--sun);background:var(--soft)}
.av{display:grid;place-items:center;width:42px;height:42px;margin:0 auto 6px;border-radius:50%;background:var(--soft);font-style:normal;font-weight:800;font-size:18px}
.pg b{display:block;color:var(--pri);font-size:15px}
.pg small{display:block;color:var(--mut);font-weight:400;font-size:12px}
.ln{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px dashed var(--ln)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:30px;height:30px;border-radius:50%;border:1px solid var(--ln);background:var(--bg);color:var(--ink);cursor:pointer;font-size:17px}
.tt{display:flex;justify-content:space-between;font-weight:800;font-size:22px;margin:14px 0}
.msg{background:var(--soft);border-right:4px solid var(--sun);border-radius:10px;padding:10px 14px;margin-bottom:12px;font-weight:600}
.login{min-height:100vh;display:grid;place-items:center;align-content:center;gap:14px;background:var(--side);padding:20px}
.login .card{width:100%;max-width:360px;display:grid;gap:12px;padding:24px;border-radius:20px}
.err{color:var(--acc);min-height:22px;font-size:14px}
.hint{color:#9FB3A9;font-size:13px;text-align:center}
.home{min-height:100vh;background:radial-gradient(ellipse at 20% 0%,#17344F 0%,#0A1220 48%,#04070D 100%);color:#fff;padding:16px 16px 40px}
:root[data-theme="light"] .home{background:radial-gradient(ellipse at 20% 0%,#DCECE4 0%,#EEF3F0 52%,#E5EAE7 100%);color:var(--ink)}
:root[data-theme="eye"] .home{background:radial-gradient(ellipse at 20% 0%,#E8D4A8 0%,#F3E6C6 52%,#EAD9B2 100%);color:var(--ink)}
.ht{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;max-width:760px;margin:0 auto}
.home .ghost{color:inherit;border-color:currentColor;opacity:.75}
.ag{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:26px 10px;max-width:760px;margin:44px auto 0}
.ag button{background:none;border:0;color:inherit;display:flex;flex-direction:column;align-items:center;gap:9px;font-size:13px;cursor:pointer}
.ic{width:68px;height:68px;border-radius:20px;display:grid;place-items:center;font-size:32px;font-style:normal}
.ic{border:0;box-shadow:0 8px 16px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.35);transition:transform .15s}
.ag button:active .ic,.ag button:hover .ic{transform:scale(1.07)}
input[type=checkbox]{width:18px;height:18px;padding:0}
input[type=color]{width:52px;padding:3px;flex:none}
select{font:inherit;height:44px;padding:0 10px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);min-width:0;width:100%}
td select{height:34px;width:auto}
.chk{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 0}
.chk label,.row label{display:flex;align-items:center;gap:8px}
.row{display:flex;gap:10px;align-items:center}
.pi{display:block;width:44px;height:44px;margin:0 auto 6px;border-radius:50%;object-fit:cover}
.th{display:grid;place-items:center;width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--soft);font-weight:800;cursor:pointer}
.thl{cursor:pointer;display:block}
.fl{display:grid;gap:2px;font-size:12px;color:var(--mut)}
.fl input{height:44px;padding:8px 10px}
td input{height:34px;width:auto;padding:0 8px}
td input[type=file]{display:none}
.lnk{background:none;border:0;color:var(--pri);font:800 15px 'Vazirmatn',sans-serif;cursor:pointer;text-decoration:underline;padding:0}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;height:38px;font:600 14px 'Vazirmatn',sans-serif;color:var(--mut);cursor:pointer}
.seg button.on{background:var(--sf);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
input[dir=ltr]{text-align:left}
textarea{font:inherit;width:100%;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);padding:10px;min-height:84px}
.chip{padding:2px 12px;border-radius:20px;font-size:12px;font-weight:600}
.chip.open{background:var(--soft);color:var(--acc)}
.chip.done{background:var(--soft);color:var(--ok)}
.ic,nav button i{position:relative}
.ic img.ci{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block}
.bd{position:absolute;top:-6px;left:-6px;background:var(--acc);color:#fff;border-radius:12px;min-width:22px;height:22px;padding:0 5px;font:700 12px 'Vazirmatn',sans-serif;display:grid;place-items:center;font-style:normal}
.nbar{display:block;width:100%;max-width:760px;margin:20px auto 0;background:rgba(243,178,50,.18);border:1px solid var(--sun);color:inherit;border-radius:12px;padding:10px 14px;font:600 14px 'Vazirmatn',sans-serif;cursor:pointer;text-align:right}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--soft);border-bottom:2px solid var(--sun);padding:8px 16px;font-size:13px}
</style>
</head>
<body>
<div id="root"></div>
<script>
var CUR_THEME='light';
try{CUR_THEME=localStorage.getItem('rover-theme')||(window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light')}catch(e){}
function setTheme(m){
 CUR_THEME=m;
 document.documentElement.setAttribute('data-theme',m);
 try{localStorage.setItem('rover-theme',m)}catch(e){}
 syncThemeUI();
}
function syncThemeUI(){
 document.querySelectorAll('.tbar button[data-th]').forEach(function(b){
  b.classList.toggle('on',b.getAttribute('data-th')==CUR_THEME);
 });
}
function themeBarHTML(){
 return '<div class="tbar" role="group" aria-label="دۆخی بینین">'
  +'<button type="button" data-th="light" class="'+(CUR_THEME=='light'?'on':'')+'">☀️ ڕووناک</button>'
  +'<button type="button" data-th="dark" class="'+(CUR_THEME=='dark'?'on':'')+'">🌙 تاریک</button>'
  +'<button type="button" data-th="eye" class="'+(CUR_THEME=='eye'?'on':'')+'">👁️ ئاسوودەیی چاو</button>'
  +'</div>';
}
setTheme(CUR_THEME);

var tapTimer=null;
document.addEventListener('pointerdown',function(e){
 if(e.target.closest('button,input,select,textarea,label,a'))return;
 document.documentElement.classList.add('tap-shift');
 clearTimeout(tapTimer);
 tapTimer=setTimeout(function(){
  document.documentElement.classList.remove('tap-shift');
 },900);
},{passive:true});

document.addEventListener('click',function(e){
 var tb=e.target.closest('.tbar button[data-th]');
 if(tb){setTheme(tb.getAttribute('data-th'));return}
});

var T={rep:'ڕاپۆرت',ws:'شوێنەکان',sup:'سەرپەرشتیار',log:'تۆماری چالاکی',roles:'ڕۆڵەکان',settings:'ڕێکخستن',home:'سەرەکی',dash:'داشبۆرد',pos:'فرۆشگا POS',sales:'فاکتوورەکان',products:'کۆگا',purchase:'کڕین',expenses:'خەرجی',acc:'موحاسیب',hr:'کارمەندان',users:'بەکارهێنەران'};
var ALL=['dash','pos','sales','products','purchase','expenses','acc','hr','sup','rep'];
var IC0=0;var IC={rep:'🔔',ws:'🏢',sup:'👁️',log:'📜',roles:'🛡️',settings:'⚙️',home:'🏠',dash:'📊',pos:'🛒',sales:'🧾',products:'📦',purchase:'🚚',expenses:'💸',acc:'💰',hr:'👥',users:'🔑'};
var C={
 products:{f:['بەرهەم','بڕ','نرخی فرۆشتن'],n:[1,2],tl:'نرخی کۆگا',tot:function(r){return r[1]*r[2]}},
 purchase:{f:['دابینکەر','بەرهەم','بڕ','نرخی کڕین','نرخی فرۆشتن'],n:[2,3,4],tl:'کۆ',tot:function(r){return r[2]*r[3]}},
 expenses:{f:['بابەت','بڕ'],n:[1],tl:'بڕ',tot:function(r){return r[1]}},
 hr:{f:['ناو','پلە','مووچە'],n:[2],tl:'مووچە',tot:function(r){return r[2]}},
 users:{f:['ناو','وشەی نهێنی','ڕۆڵ'],n:[]}
};
var R=null,D=null;
try{var s3=localStorage.getItem('rover-erp3');if(s3)R=JSON.parse(s3)}catch(e){}
if(!R){var old=null;try{var s2=localStorage.getItem('rover-erp2');if(s2)old=JSON.parse(s2)}catch(e){}
 R={gate:(old&&old.gate)||['angilos','1234'],t:{}};R.t.rover=old||{users:[['rover','1111','admin'],['cashier','1111','cashier']],products:[],sales:[],purchase:[],expenses:[],hr:[]};}
if(!R.gate)R.gate=['',''];
if(!R.root)R.root='rover';
if(!R.rep)R.rep=[];
Object.keys(R.t).forEach(function(k){if(k!='rover'&&!R.t[k].wpass)R.t[k].wpass=R.gate[1]});
D=R.t.rover;
function save(){try{localStorage.setItem('rover-erp3',JSON.stringify(R))}catch(e){if(!document.getElementById('qw')){var d=document.createElement('div');d.id='qw';d.style.cssText='position:fixed;top:0;left:0;right:0;z-index:99;background:#C8402F;color:#fff;padding:10px 14px;font:600 14px Vazirmatn,sans-serif;text-align:center';d.textContent='ئاگاداری: بیرگەی وێبگەر پڕە و داتاکان پاشەکەوت نابن. وێنەکان بچووک بکەرەوە.';document.body.appendChild(d)}}}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
function esc(x){return String(x).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function fmt(n){return Number(n).toLocaleString('en-US')}
function sum(k){return D[k].reduce(function(a,r){return a+C[k].tot(r)},0)}
function sSales(){return D.sales.reduce(function(a,i){return a+(i.ret?0:i.total)},0)}
var me=null,cur='pos',cart={},note='',root=document.getElementById('root');

function enter(t,k,f){D=t;me={n:f[0],r:f[2],t:k};applyCfg();lg('چوونەژوورەوە','ڕۆڵ: '+f[2]);cart={};note='';var ts=tabsFor();if(isAdm()||!ts.length){cur='home';home()}else{cur=ts[0];shell()}}
function gateView(err){
 root.innerHTML='<div class="login"><div style="width:100%;max-width:360px;display:flex;justify-content:center">'+themeBarHTML()+'</div><div class="card"><div class="brand" style="color:var(--pri)"><span class="logo" style="background:var(--pri);color:var(--pri-ink)">R</span> ROVER</div><form id="gf" style="display:grid;gap:10px"><input name="w" placeholder=".com" dir="ltr" autocapitalize="none" autocorrect="off" spellcheck="false" autocomplete="username" required><input name="p" type="password" placeholder="وشەی نهێنی" autocomplete="current-password" required><div class="err">'+(err||'')+'</div><button class="btn">بەردەوامبە</button></form></div></div>';
 document.getElementById('gf').onsubmit=function(e){e.preventDefault();var wn=e.target.w.value.trim(),p=e.target.p.value;
  if(wn.toLowerCase()==R.root){var f=R.t.rover.users.filter(function(x){return x[0]==R.root&&x[1]==p&&x[2]=='admin'})[0];
   if(f){enter(R.t.rover,'rover',f);return}
   D=R.t.rover;lgu(wn,'هەوڵی هەڵەی چوونەژوورەوەی سەرۆک');return gateView('ناو یان وشەی نهێنی هەڵەیە')}
  var k=findT(wn),t=k&&k!='rover'&&R.t[k];
  if(!t||p!=t.wpass){D=t||R.t.rover;lgu('-','هەوڵی هەڵەی دەروازەی شوێن',t?'':'شوێن: '+wn);D=R.t.rover;return gateView('ناوی شوێن یان وشەی نهێنی هەڵەیە')}
  loginView(k)};
}
function findT(n){n=(n||'').trim().toLowerCase();var r=null;Object.keys(R.t).forEach(function(k){if(k.toLowerCase()==n)r=k});return r}
function newT(u,p,w){return{users:[[u,p,'admin']],roles:[{n:'admin',a:[]},{n:'cashier',a:['pos']},{n:'کۆگا',a:['products']}],products:[],sales:[],purchase:[],expenses:[],hr:[],log:[],cfg:{name:w,labels:{},colors:{},imgs:{}},mig1:1}}
function backHQ(){D=R.t.rover;me.t='rover';applyCfg();cur='ws';shell()}
function loginView(k,err){
 var t=R.t[k];
 root.innerHTML='<div class="login"><div style="width:100%;max-width:360px;display:flex;justify-content:center">'+themeBarHTML()+'</div><div class="card"><div class="brand" style="color:var(--pri)"><span class="logo" style="background:var(--pri);color:var(--pri-ink)">R</span> '+esc(t.cfg.name)+'</div><small dir="ltr" style="text-align:center;color:var(--mut)">'+esc(k)+'</small><b>ئەژماری خۆت</b><form id="lf" style="display:grid;gap:10px"><input name="u" placeholder="ناوی بەکارهێنەر" autocomplete="username" required><input name="p" type="password" placeholder="وشەی نهێنی" autocomplete="current-password" required><div class="err">'+(err||'')+'</div><button class="btn">چوونەژوورەوە</button><button type="button" class="ghost" id="bk">گەڕانەوە</button></form></div></div>';
 document.getElementById('bk').onclick=function(){gateView()};
 document.getElementById('lf').onsubmit=function(e){e.preventDefault();var u=e.target.u.value.trim(),p=e.target.p.value;
  var f=t.users.filter(function(x){return x[0]==u&&x[1]==p})[0];
  if(!f){D=t;lgu(u,'هەوڵی هەڵەی چوونەژوورەوە');D=R.t.rover;return loginView(k,'ناو یان وشەی نهێنی هەڵەیە')}
  enter(t,k,f)};

 var qi=document.getElementById('q');qi.oninput=pg;qi.onkeydown=function(e){if(e.key!='Enter')return;var v=qi.value.trim(),i=-1;D.products.forEach(function(p,j){if(p[3]==v)i=j});if(i>-1){if(addC(i))lg('سکان',D.products[i][0]+' · '+v);qi.value='';pg()}};pg();cartV();
}
function addC(i){var p=D.products[i];if(!p||(p[5]&&p[5]<today())||(cart[i]||0)>=p[1])return false;cart[i]=(cart[i]||0)+1;cartV();return true}
function pg(){
 var q=document.getElementById('q').value.trim(),td=today(),h='';
 D.products.forEach(function(p,i){if(p[1]<=0)return;if(q&&p[0].indexOf(q)<0&&p[3]!=q)return;var ex=p[5]&&p[5]<td;
  h+='<button data-i="'+i+'"'+(ex?' disabled style="opacity:.5"':'')+'>'+(p[4]?'<img class="pi" src="'+p[4]+'" alt="">':'<i class="av">'+esc(p[0].charAt(0))+'</i>')+esc(p[0])+'<b>'+fmt(p[2])+'</b><small>'+(ex?'بەسەرچووە':'کۆگا: '+p[1])+'</small></button>'});
 var el=document.getElementById('pg');el.innerHTML=h||'<div class="empty">بەرهەم نییە</div>';
 el.onclick=function(e){var b=e.target.closest('button');if(b)addC(+b.getAttribute('data-i'))};
}
function cartV(){
 var h='<b>سەبەتە</b>',t=0,ks=Object.keys(cart);
 ks.forEach(function(i){var p=D.products[i];if(!p){delete cart[i];return}var q=cart[i];t+=q*p[2];
  h+='<div class="ln"><span>'+esc(p[0])+'</span><span class="q"><button data-d="-1" data-i="'+i+'">−</button>'+q+'<button data-d="1" data-i="'+i+'">+</button></span><b>'+fmt(q*p[2])+'</b></div>'});
 if(!ks.length)h+='<div class="empty">بەرهەمێک هەڵبژێرە</div>';
 h+='<div class="tt"><span>کۆ</span><span>'+fmt(t)+'</span></div><button class="btn pay" id="pay"'+(t?'':' disabled')+'>پارەدان</button>';
 var el=document.getElementById('cart');el.innerHTML=h;
 el.onclick=function(e){var b=e.target;
  if(b.getAttribute('data-d')){var i=b.getAttribute('data-i'),q=(cart[i]||0)+ +b.getAttribute('data-d');if(q<=0)delete cart[i];else if(q<=D.products[i][1])cart[i]=q;cartV()}
  if(b.id=='pay'){var td=today(),bad=Object.keys(cart).filter(function(i){var p=D.products[i];return p&&p[5]&&p[5]<td});if(bad.length){note='بەرهەمی بەسەرچوو لە سەبەتەدایە: '+bad.map(function(i){return D.products[i][0]}).join('، ');pos();return}
   var items=[],tot=0;Object.keys(cart).forEach(function(i){var p=D.products[i],q=cart[i];items.push([p[0],q,p[2]]);tot+=q*p[2];p[1]-=q});
   var id=(D.sales.length?D.sales[D.sales.length-1].id:0)+1;
   D.sales.push({id:id,d:new Date().toLocaleString('en-GB'),u:me.n,items:items,total:tot});
   lg('فرۆشتن','فاکتوور #'+id+' · '+fmt(tot)+' · '+items.map(function(x){return x[0]+'×'+x[1]}).join('، '));cart={};note='فاکتووری #'+id+' تۆمار کرا: '+fmt(tot);save();pos();
  }};
}
function mod(k){
 var m=C[k],a=document.getElementById('app'),h='<h2>'+L(k)+'</h2><form class="f" id="f">';
 m.f.forEach(function(n,i){h+=(k=='users'&&i==2)?'<select name="2">'+D.roles.map(function(x){return'<option>'+esc(x.n)+'</option>'}).join('')+'</select>':'<input name="'+i+'" placeholder="'+n+'" '+(m.n.indexOf(i)>-1?'type="number" min="0" step="any"':'')+(k=='purchase'&&i==4?'':' required')+'>'});
 h+='<button class="btn">زیادکردن</button></form>';
 if(!D[k].length)h+='<div class="card empty">هیچ تۆمارێک نییە. یەکەمیان زیاد بکە.</div>';
 else{
  h+='<div class="tw"><table><tr>'+m.f.map(function(n){return'<th>'+n.split(' (')[0]+'</th>'}).join('')+(m.tot&&k!='expenses'&&k!='hr'?'<th>'+m.tl+'</th>':'')+'<th></th></tr>';
  D[k].forEach(function(r,i){
   h+='<tr>'+r.map(function(c,j){return'<td>'+(k=='users'&&j==1?esc(c):k=='users'&&j==2?usel(c,i):m.n.indexOf(j)>-1?fmt(c):esc(c))+'</td>'}).join('')+(m.tot&&k!='expenses'&&k!='hr'?'<td><b>'+fmt(m.tot(r))+'</b></td>':'')+'<td>'+(k=='users'&&(r[0]==me.n||(me.t=='rover'&&r[0]==R.root))?'':'<button class="del" data-i="'+i+'">سڕینەوە</button>')+'</td></tr>'});
  h+='</table></div>';
  if(m.tot)h+='<div class="foot">'+m.tl+': '+fmt(sum(k))+'</div>';
 }
 a.innerHTML=h;
 a.querySelectorAll('select[data-u]').forEach(function(x){x.onchange=function(){lg('گۆڕینی ڕۆڵ',D.users[+x.getAttribute('data-u')][0]+' ← '+x.value);D.users[+x.getAttribute('data-u')][2]=x.value;save()}});
 document.getElementById('f').onsubmit=function(e){
  e.preventDefault();
  var r=m.f.map(function(n,i){var v=e.target.elements[i].value.trim();return m.n.indexOf(i)>-1?Number(v||0):v});
  if(k=='purchase'){var p=D.products.filter(function(x){return x[0]==r[1]})[0];
   if(p){p[1]+=r[2];if(r[4]>0)p[2]=r[4]}else D.products.push(fixP([r[1],r[2],r[4]||r[3]]))}
  if(k=='users'&&D.users.some(function(u){return u[0]==r[0]})){if(!a.querySelector('.msg'))a.insertAdjacentHTML('afterbegin','<div class="msg">ئەم ناوە پێشتر هەیە</div>');return}
  D[k].push(r);lg('زیادکردن · '+L(k),dsc(k,r));save();draw();
 };
 a.querySelectorAll('.del').forEach(function(b){b.onclick=function(){lg('سڕینەوە · '+L(k),dsc(k,D[k][+b.getAttribute('data-i')]));D[k].splice(+b.getAttribute('data-i'),1);if(k=='products')cart={};save();draw()}});
}
gateView();
</script>
</body>
</html>
